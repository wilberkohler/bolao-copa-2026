<!doctype html>
<html lang="pt-BR">
<head>

  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Bolao Futebol 2026</title>
  <style>
    :root {
      color-scheme: light;
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;

      padding: 20px;
    }

      font-weight: 600;
    }

  <div class="card">
    <h1>Bolao Futebol 2026</h1>
    <p>Este wrapper iOS carrega a versao web hospedada do sistema.</p>
    <p>Edite o arquivo <strong>capacitor.config.json</strong> para apontar para sua URL HTTPS.</p>
    <p><a href="https://SEU_DOMINIO_AQUI">Abrir ambiente configurado</a></p>
  </div>
</body>
</html>
