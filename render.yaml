services:
  - type: web
    name: bolao2026
    env: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    preDeployCommand: python maintenance_startup.py
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 2 --threads 2 --timeout 60 --keep-alive 5 wsgi:app
    autoDeploy: true
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
  - type: cron
    name: bolao2026-sync-resultados-mata-mata
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: python sync_results_job.py
    schedule: "0 * * * *"
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromService:
          name: bolao2026
          type: web
          envVarKey: DATABASE_URL
      - key: FOOTBALL_DATA_API_KEY
        sync: false
      - key: FOOTBALL_DATA_BASE_URL
        value: https://api.football-data.org/v4
      - key: RESULT_SYNC_DAYS_BACK
        value: "1"
      - key: RESULT_SYNC_DAYS_FORWARD
        value: "0"
      - key: RESULT_SYNC_KNOCKOUT_ONLY
        value: "true"
