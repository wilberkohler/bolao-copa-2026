services:
  - type: web
    name: bolao2026
    env: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    preDeployCommand: python maintenance_startup.py
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 2 --threads 2 --timeout 60 --keep-alive 5 wsgi:app
    autoDeploy: true
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: RESULT_SYNC_KNOCKOUT_ONLY
        value: "false"
  - type: cron
    name: bolao-copa-2026
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: >-
      python -c "import os,requests; u='https://bolao2026-9jgh.onrender.com/internal/sync-resultados'; h={'X-Sync-Token':os.environ['RESULT_SYNC_TOKEN']}; r=requests.post(u,headers=h,timeout=120); print(r.status_code); print(r.text); r.raise_for_status()"
    schedule: "0 * * 6,7 *"
    autoDeploy: true
    envVars:
      - key: RESULT_SYNC_TOKEN
        sync: false
