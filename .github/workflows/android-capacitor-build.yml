name: Android Capacitor Build

on:
  workflow_dispatch:
  push:
    paths:
      - "mobile/android-wrapper/**"
      - ".github/workflows/android-capacitor-build.yml"

jobs:
  build-android:
    name: Build Android APK and AAB
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: mobile/android-wrapper

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile/android-wrapper/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Add Android platform
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Configure Android app version
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("android/app/build.gradle")
          text = path.read_text()
          import re
          text = re.sub(r"versionCode\\s+\\d+", "versionCode 3", text)
          text = re.sub(r'versionName\\s+"[^"]+"', 'versionName "1.0.2"', text)
          path.write_text(text)
          PY

      - name: Install release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "ANDROID_KEYSTORE_BASE64 secret is missing"
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/bolao-upload-key.jks

      - name: Check release signing secrets
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_PASSWORD" ] || [ -z "$ANDROID_KEY_ALIAS" ] || [ -z "$ANDROID_KEY_PASSWORD" ]; then
            echo "Android signing secrets are missing"
            exit 1
          fi

      - name: Build debug APK
        run: ./android/gradlew -p android assembleDebug

      - name: Build release AAB
        run: ./android/gradlew -p android bundleRelease

      - name: Sign release AAB
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          jarsigner \
            -keystore android/app/bolao-upload-key.jks \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -keypass "$ANDROID_KEY_PASSWORD" \
            -signedjar android/app/build/outputs/bundle/release/app-release-signed.aab \
            android/app/build/outputs/bundle/release/app-release.aab \
            "$ANDROID_KEY_ALIAS"
          jarsigner -verify -verbose -certs android/app/build/outputs/bundle/release/app-release-signed.aab

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: bolao-android-debug-apk
          path: mobile/android-wrapper/android/app/build/outputs/apk/debug/*.apk

      - name: Upload release AAB
        uses: actions/upload-artifact@v4
        with:
          name: bolao-android-release-aab
          path: mobile/android-wrapper/android/app/build/outputs/bundle/release/app-release-signed.aab
