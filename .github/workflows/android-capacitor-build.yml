name: Android Capacitor Build

on:
  workflow_dispatch:
  push:
    paths:
      - "mobile/android-wrapper/**"
      - ".github/workflows/android-capacitor-build.yml"

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: mobile/android-wrapper

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile/android-wrapper/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Add Android platform
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build debug APK
        run: ./android/gradlew -p android assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: bolao-android-debug-apk
          path: mobile/android-wrapper/android/app/build/outputs/apk/debug/*.apk
