{% extends "base.html" %}
{% block title %}{{ tr('delete_account_title') }}{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-12 col-md-9 col-lg-7">
    <div class="card shadow-sm">
      <div class="card-header bg-danger text-white">
        <strong><i class="bi bi-shield-x"></i> {{ tr('delete_account_title') }}</strong>
      </div>
      <div class="card-body">
        <p class="text-muted">{{ tr('delete_account_intro') }}</p>

        <form method="post" action="{{ url_for('solicitar_exclusao_dados') }}" class="row g-3">
          <div class="col-12">
            <label class="form-label">E-mail da conta</label>
            <input type="email" class="form-control" value="{{ user.email }}" disabled>
          </div>

          <div class="col-12">
            <label for="senha" class="form-label">{{ tr('delete_account_password') }}</label>
            <input type="password" class="form-control" id="senha" name="senha" required autocomplete="current-password">
          </div>

          <div class="col-12">
            <label for="confirmacao" class="form-label">{{ tr('delete_account_confirm_label') }}</label>
            <input type="text" class="form-control" id="confirmacao" name="confirmacao" required autocomplete="off">
          </div>

          <div class="col-12 d-flex gap-2">
            <button type="submit" class="btn btn-danger">
              <i class="bi bi-trash"></i> {{ tr('delete_account_button') }}
            </button>
            <a href="{{ url_for('dashboard') }}" class="btn btn-outline-secondary">{{ tr('delete_account_cancel') }}</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
