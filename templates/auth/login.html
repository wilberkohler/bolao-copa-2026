<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#198754">
  <link rel="manifest" href="{{ url_for('manifest_webmanifest') }}">
  <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='icons/icon.svg') }}">
  <link rel="apple-touch-icon" href="{{ url_for('static', filename='icons/icon.svg') }}">
  <title>Login - Bolão Copa 2026</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}?v=20260529-1">
  <style>
    body { display: flex; align-items: center; justify-content: center; min-height: 100vh; background: linear-gradient(135deg, #198754 0%, #0d5132 100%); }
    .login-container { width: 100%; max-width: 400px; padding: 1rem; }
    .card { border: none; border-radius: 8px; box-shadow: 0 8px 32px rgba(0,0,0,0.2); }
    .btn-login { background: #198754; border: none; color: #fff; font-weight: 600; padding: 10px 20px; }
    .btn-login:hover, .btn-login:focus { background: #0d5132; color: #fff; }
  </style>
</head>
<body>

<main class="login-container">
  <div class="card">
    <div class="card-body p-4 p-sm-5">
      <div class="text-center mb-4">
        <h1 class="display-6 mb-2" aria-hidden="true"><i class="bi bi-trophy-fill text-success"></i></h1>
        <h2 class="h4">Bolão Copa 2026</h2>
        <p class="text-muted">Sistema de Palpites</p>
      </div>

      {% with msgs = get_flashed_messages(with_categories=true) %}
        {% for cat, msg in msgs %}
          <div class="alert alert-{{ cat }} alert-dismissible fade show" role="alert">
            {{ msg }}
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Fechar"></button>
          </div>
        {% endfor %}
      {% endwith %}
      {% if request.args.get('logged_out') %}
        <div class="alert alert-info alert-dismissible fade show" role="alert">
          Você saiu.
          <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Fechar"></button>
        </div>
      {% endif %}

      <form method="post" class="js-submit-once">
        <div class="mb-3">
          <label for="email" class="form-label fw-bold">E-mail</label>
          <input type="email" id="email" name="email" class="form-control" value="{{ email|default('', true) }}" autocomplete="email" required autofocus>
        </div>
        <div class="mb-4">
          <label for="senha" class="form-label fw-bold">Senha</label>
          <input type="password" id="senha" name="senha" class="form-control" autocomplete="current-password" required>
        </div>
        <button type="submit" class="btn btn-login w-100 mb-3" data-loading-text="Entrando...">
          <i class="bi bi-box-arrow-in-right" aria-hidden="true"></i> Entrar
        </button>
      </form>

      <hr>
      <p class="text-center text-muted mb-0">
        Ainda não tem conta? <a href="{{ url_for('registro') }}" class="fw-bold text-decoration-none text-success text-nowrap">Cadastre-se aqui</a>
      </p>
    </div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
  document.querySelectorAll(".js-submit-once").forEach(function (form) {
    form.addEventListener("submit", function () {
      var button = form.querySelector("button[type='submit']");
      if (!button) return;
      button.disabled = true;
      button.innerHTML = '<span class="spinner-border spinner-border-sm me-2" aria-hidden="true"></span>' + button.dataset.loadingText;
    });
  });

  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("/service-worker.js").catch(function (err) {
        console.log("Service worker registration failed:", err);
      });
    });
  }
</script>
</body>
</html>
